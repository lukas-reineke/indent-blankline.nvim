name: Unit Tests

on:
  workflow_call:
    inputs:
      neovim_versions:
        required: true
        type: string

jobs:
  tests:
    name: unit tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        rev: ${{ fromJson(inputs.neovim_versions) }}
    steps:
      - uses: actions/checkout@v4
      - run: date +%F > todays-date
      - name: Restore cache for Neovim
        uses: actions/cache@v4
        with:
          path: .ci/neovim
          key: ${{ matrix.rev }}-${{ hashFiles('todays-date') }}
      - name: Prepare
        run: |
          test -d .ci/neovim || {
            mkdir -p .ci/neovim
            url="https://github.com/neovim/neovim/releases/download/${{ matrix.rev }}"
            # the linux asset was renamed in v0.10.4, fall back to the old name for older releases
            curl -sfL "$url/nvim-linux-x86_64.tar.gz" -o nvim.tar.gz \
              || curl -sSfL "$url/nvim-linux64.tar.gz" -o nvim.tar.gz
            tar xzf nvim.tar.gz --strip-components=1 -C "${PWD}/.ci/neovim"
            rm nvim.tar.gz
          }

      - name: Run tests
        run: |
          export PATH="${PWD}/.ci/neovim/bin:${PATH}"
          export VIM="${PWD}/.ci/neovim/share/nvim/runtime"
          nvim --version
          make test
